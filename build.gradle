plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

// The jar is named <archivesName>-<version>.jar  ->  fiststyle-1.20.1.jar
version = '1.20.1'
group = 'com.fiststyle'
base { archivesName = 'fiststyle' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    // Epic Fight and Weapons of Miracles jars are placed in libs/ (the GitHub workflow downloads them)
    flatDir { dir 'libs' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    compileOnly fg.deobf('local:epicfight:20.14.17')
    compileOnly fg.deobf('local:wom:2.0.171')
}

tasks.named('jar').configure {
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
